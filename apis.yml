name: Avere Systems
description: Avere Systems was a Pittsburgh-based enterprise storage company building hybrid cloud NAS
  technology, best known for its FXT Series Edge filers and the vFXT virtual appliance that accelerated
  and tiered file workloads across on-premises NAS and public cloud object storage. The company was
  acquired by Microsoft in January 2018 and folded into Microsoft Azure, where the technology lives on
  as Avere vFXT for Azure. Avere Systems no longer operates as an independent company and publishes no
  developer portal or public API of its own; its former domain (averesystems.com) now 301-redirects to
  Microsoft's Avere landing page.
